services:
  # Serviço do PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: sorteio_postgres
    restart: always
    environment:
      POSTGRES_DB: db_bolao
      POSTGRES_USER: bolao_cota_admin
      POSTGRES_PASSWORD: root1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # O init-db.sql só executa na primeira criação do volume
      # Se você já criou o banco, comente a linha abaixo:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - sorteio_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bolao_cota_admin -d db_bolao"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serviço da API Node.js
  api:
    build: .
    container_name: sorteio_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: db_bolao
      DB_USER: bolao_cota_admin
      DB_PASSWORD: root1234
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sorteio_network
    volumes:
      - /app/node_modules

volumes:
  postgres_data:
    driver: local

networks:
  sorteio_network:
    driver: bridge
